<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page reach into the notch/home-indicator
         area; the layout then pads itself in via env(safe-area-inset-*) so
         nothing sits under a notch or edge gesture zone.
         maximum-scale/user-scalable=no stops Safari pinch-zooming the whole
         page, which is what pushes the layout wider than the screen and cuts
         the sides off. The board's own pinch-zoom is handled inside the SVG. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Runs full-screen without browser chrome when launched from the Home Screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Risky Reign" />
    <meta name="description" content="Risky Reign — a free online multiplayer strategy board game. Build settlements, trade resources and battle for territory with friends in your browser." />
    <title>Risky Reign</title>
  </head>
  <body>
    <noscript>Risky Reign is a free online multiplayer strategy board game played in the browser. Enable JavaScript to play.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
